services:
  hermes:
    image: ghcr.io/sanhuesoft/hermes:latest
    container_name: hermes
    restart: unless-stopped
    ports:
      - "5050:3000"
    environment:
      - NODE_ENV=production
      - DATA_DIR=/data
      - PORT=3000
    volumes:
      # Carpeta persistente donde se guardan libros, portadas y la base de datos SQLite
      - ./data:/data
